# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name type.yogeshc.com;
    return 301 https://$host$request_uri;
}

# HTTPS server block for Cloudflare Full (Strict)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name type.yogeshc.com;

    # Cloudflare Origin SSL certificates
    ssl_certificate /etc/ssl/cloudflare/type.yogeshc.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/type.yogeshc.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Memory-efficient buffer sizes for 1GB RAM VPS
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    client_max_body_size 1m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Serve static Astro build
    root /var/www/html/typing-trainer/client/dist;
    index index.html;

    # Static assets with immutable caching
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Reverse proxy API to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffers 8 8k;
        proxy_buffer_size 8k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
